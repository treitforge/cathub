[package]
name = "cathub"
description = "Multi-client CAT and WinKeyer hub daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
name = "cathub"
path = "src/lib.rs"

[[bin]]
name = "cathub"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
cathub-protocol = { path = "../cathub-protocol", version = "0.2.1" }
cathub-virtual-serial = { path = "../cathub-virtual-serial", version = "0.2.1", default-features = false }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serial2-tokio = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "io-util", "time", "net", "signal"] }
tokio-stream = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[package]
name = "cathub-virtual-serial"
description = "Private CatHub virtual serial contract and conformance tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[features]
default = ["conformance"]
conformance = ["dep:clap", "dep:serde", "dep:serde_json", "dep:windows-sys"]

[[bin]]
name = "serial-conformance"
path = "src/bin/serial-conformance.rs"
required-features = ["conformance"]

[dependencies]
clap = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", optional = true, features = [
    "Win32_Devices_Communication",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[lints]
workspace = true

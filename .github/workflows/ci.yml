name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: bufbuild/buf-action@v1.4.0
        with:
          version: 1.50.0
          github_token: ${{ github.token }}
          setup_only: true
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Verify package READMEs
        shell: pwsh
        run: |
          foreach ($package in @('cathub-protocol', 'cathub')) {
            $files = @(& cargo package --list -p $package)
            if ($LASTEXITCODE -ne 0) {
              throw "cargo package --list failed for $package"
            }
            if ($files -notcontains 'README.md') {
              throw "$package package does not contain README.md"
            }
          }
      - run: buf lint

  dotnet-protocol:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-dotnet@v5.4.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet build CatHub.slnx -c Release
